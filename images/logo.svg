  <!-- Bar chart -->
  <rect x="62" y="30" width="5" height="32" rx="1" fill="url(#g1)"/>
  <rect x="70" y="20" width="5" height="42" rx="1" fill="url(#g1)"/>
  <rect x="78" y="38" width="5" height="24" rx="1" fill="url(#g1)" opacity="0.75"/>

  <!-- AFAQ AHMAD — big bold text -->
  <text x="94" y="38" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" letter-spacing="3" fill="url(#g1)">AFAQ AHMAD</text>

  <!-- Line + REAL ESTATE -->
  <line x1="94" y1="48" x2="134" y2="48" stroke="url(#g2)" stroke-width="1"/>
  <text x="140" y="55" font-family="'Manrope', Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="5" fill="url(#g1)">REAL ESTATE</text>
  <line x1="232" y1="48" x2="272" y2="48" stroke="url(#g2)" stroke-width="1"/>
