<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 70" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C97A"/>
      <stop offset="50%" stop-color="#C9A962"/>
      <stop offset="100%" stop-color="#A07830"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C97A"/>
      <stop offset="100%" stop-color="#C9A962"/>
    </linearGradient>
  </defs>

  <!-- Icon: A shape -->
  <path d="M5 62 L22 8 L30 8 L15 62 Z" fill="url(#g1)"/>
  <path d="M45 62 L22 8 L30 8 L53 62 Z" fill="url(#g1)"/>
