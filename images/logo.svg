<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C97A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9A962;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A07830;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C97A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9A962;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left side of A -->
  <path d="M4 52 L18 8 L25 8 L13 52 Z" fill="url(#goldGrad)" />
  <!-- Right side of A -->
  <path d="M36 52 L18 8 L25 8 L43 52 Z" fill="url(#goldGrad)" />
  <!-- Roof arch -->
  <path d="M2 38 Q24 2 48 38" stroke="url(#goldGrad2)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Window -->
  <rect x="20" y="38" width="7" height="9" rx="1" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Bar chart buildings -->
  <rect x="50" y="26" width="4" height="26" rx="1" fill="url(#goldGrad)"/>
  <rect x="56" y="18" width="4" height="34" rx="1" fill="url(#goldGrad)"/>
  <rect x="62" y="32" width="4" height="20" rx="1" fill="url(#goldGrad)" opacity="0.7"/>

  <!-- AFAQ AHMAD -->
  <text x="76" y="28" font-family="'Playfair Display', 'Georgia', serif" font-size="20" font-weight="600" letter-spacing="2.5" fill="url(#goldGrad)">AFAQ AHMAD</text>

  <!-- Divider + REAL ESTATE -->
  <line x1="76" y1="35" x2="106" y2="35" stroke="url(#goldGrad2)" stroke-width="0.8"/>
  <text x="111" y="40" font-family="'Manrope', 'Arial', sans-serif" font-size="8.5" font-weight="500" letter-spacing="4.5" fill="url(#goldGrad)">REAL ESTATE</text>
  <line x1="183" y1="35" x2="215" y2="35" stroke="url(#goldGrad2)" stroke-width="0.8"/>
</svg>
